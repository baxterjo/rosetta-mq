[connection]
host = "127.0.0.1"
port = 1883
client_id = "rosetta-mq"
tls = false

[decoder.device_proto]
kind = "protobuf"
proto_file = "../protobuf/device.proto"
message_type = "device.v1.DeviceReading"
# device.proto imports common/status.proto, a sibling of protobuf/ -- needs an include path
# covering both directories, not just device.proto's own parent.
include_paths = [".."]

[decoder.json_template]
kind = "template"
template = """
{{ topic }}: {{ payload.device_id }} is {{ payload.temperature_c }}C
"""

[[topic]]
topic_filter = "devices/+/raw"
decoder = { kind = "utf8" }

[[topic]]
topic_filter = "sensors/#"
decoder = { kind = "hexdump" }

[[topic]]
topic_filter = "sensors/proto/#"
decoder = "device_proto"

[[topic]]
topic_filter = "devices/+/json"
decoder = "json_template"

[[topic]]
topic_filter = "devices/+/status"
# No `decoder` -- rosetta-mq subscribes so any other MQTT client can see this traffic, but
# doesn't decode or republish it.
