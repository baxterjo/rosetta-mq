[broker]
host = "127.0.0.1"
port = 1883
client_id = "rosetta-mq"

[[topic]]
topic_filter = "devices/+/raw"
decoder = "utf8"

[[topic]]
topic_filter = "sensors/#"
decoder = "hexdump"

[[topic]]
topic_filter = "sensors/proto/#"
decoder = "protobuf"
proto_file = "../protobuf/device.proto"
message_type = "device.v1.DeviceReading"
